# Static site served by nginx-unprivileged (uid 101, port 8080).
# There is no application server: Next.js runs only at build time.
server {
    listen       8080;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    server_tokens off;
    # Only GET/HEAD make sense for a static site.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # Security headers. Next's static export inlines its bootstrap scripts,
    # hence 'unsafe-inline' for scripts; legacy pages load GSAP from jsdelivr
    # and fonts from Google, and embed Google Maps.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; frame-src https://maps.google.com https://www.google.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Fingerprinted build output: cache forever.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* \.(mp4|webm)$ {
        add_header Accept-Ranges bytes;
    }

    # Never serve dotfiles or the source markdown.
    location ~ /\. { deny all; return 404; }

    location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }

    error_page 404 /404.html;

    # Pre-migration article URLs.
    location = /ai-in-hospitality-case-study.html { return 301 /journal/ai-in-hospitality; }
    location = /insurance-case-study.html         { return 301 /journal/ai-in-insurance; }
    location = /ai-in-sports-case-study.html      { return 301 /journal/ai-in-sports; }
    location = /content-systems-and-ai.html       { return 301 /journal/content-systems-and-ai; }
    location = /vibe-coding-pros-and-cons.html    { return 301 /journal/vibe-coding-pros-and-cons; }
    location = /neuromorphic-spike-llms.html      { return 301 /journal/neuromorphic-spike-llms; }
}
